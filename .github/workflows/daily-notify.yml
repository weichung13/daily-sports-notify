name: 每天早上9點棒球足球賽程通知

on:
  schedule:
    - cron: '0 1 * * *'     # UTC 01:00 = 台灣時間早上 09:00
  workflow_dispatch:        # 允許你手動點擊測試

jobs:
  send-notification:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取最新程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝所需套件
        run: pip install pdfplumber pytz google-generativeai

      - name: 執行賽程通知腳本
        env:
          API_KEY: ${{ secrets.API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
